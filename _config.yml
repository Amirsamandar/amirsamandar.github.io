# =============================================================================
#  amirsamandar.github.io — site configuration
#  GitHub Pages / Jekyll. Only GitHub-Pages-whitelisted plugins are used.
#  Restart `jekyll serve` after editing this file.
# =============================================================================

# -- Identity -----------------------------------------------------------------
locale                   : "en-US"
title                    : "Amirhossein Samandar"
title_separator          : "·"
name                     : "Amirhossein Samandar"
description              : "Amirhossein Samandar, Ph.D. candidate in physics at Case Western Reserve University: likelihood-ratio detectability for cosmological models, CMB statistics and cosmic topology, and calibrated evaluation of machine-learning models."
url                      : "https://amirsamandar.github.io"
baseurl                  : ""
# GitHub "owner/repo" for this site.
repository               : "Amirsamandar/amirsamandar.github.io"
timezone                 : America/New_York

# -- Review switch --------------------------------------------------------------
# true  = every unresolved [[TODO: ...]] placeholder is rendered as a visible,
#         highlighted marker so you can find and resolve it in the browser.
# false = placeholders are hidden and neutral fallback text is shown instead.
#         Open items are listed under "Placeholders" in REPORT.md.
show_todos               : false

# -- Theme compatibility --------------------------------------------------------
# The redesigned pages use _layouts/scholar.html and assets/css/custom.css.
# The legacy AcademicPages layouts and assets/css/main.css are kept only so any
# remaining legacy page still renders; nothing in the main navigation uses them.
site_theme               : "air"

# The `author` block is read by legacy theme includes. The redesigned pages read
# _data/profile.yml, which is the single source of truth for identity and links.
author:
  avatar                 : "profile.jpg"
  name                   : "Amirhossein Samandar"
  bio                    : "Cosmology · statistical inference · probabilistic machine learning · computational methods"
  location               : "Cleveland, Ohio, USA"
  employer               : "Case Western Reserve University"
  email                  : "amirhossein.samandar@case.edu"
  arxiv                  : "https://arxiv.org/search/?searchtype=author&query=Samandar%2C+A"
  googlescholar          : "https://scholar.google.com/citations?user=cst228UAAAAJ"
  inspire-hep            : "https://inspirehep.net/authors/2778276"
  orcid                  : "https://orcid.org/0009-0004-4051-1654"
  researchgate           : "https://www.researchgate.net/profile/Amirhossein-Samandar"
  github                 : "Amirsamandar"

publication_category:

# -- Site settings ----------------------------------------------------------------
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : true
analytics:
  provider               : false

# Social sharing: the redesigned <head> builds OpenGraph tags and the
# schema.org Person record from _data/profile.yml.
og_image                 : "profile.jpg"

# -- Reading files ------------------------------------------------------------------
include:
  - _pages
  - files
exclude:
  # build tooling and repository metadata
  - .github
  - .devcontainer
  - .sass-cache
  - .jekyll-cache
  - .bundle
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - CONTRIBUTING.md
  - LICENSE
  - README.md
  - INSTALL.md
  - REPORT.md
  - scripts
  - markdown_generator
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  # template sample content that should never be published
  - _posts
  - _drafts
  - _portfolio
  - _teaching
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  # superseded route owners (replaced by publications.md / talks.md)
  - _pages/publications.html
  - _pages/talks.html
  # old record replaced by _publications/2026-10-12-beyond-kl-divergence.md
  # (its URL now redirects); excluded in case the file survives a copy-over
  - _publications/2026-09-01-beyond-kl-divergence.md
keep_files:
  - .git
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

# -- Conversion -------------------------------------------------------------------------
markdown                 : kramdown
highlighter              : rouge
excerpt_separator        : "\n\n"
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  entity_output          : as_char
  smart_quotes           : lsquo,rsquo,ldquo,rdquo

# -- Collections ----------------------------------------------------------------------
# Permalinks of existing records are set in each file's front matter and are
# unchanged from the previous site, so external links keep working.
collections:
  publications:
    output               : true
    permalink            : /publication/:path/
  talks:
    output               : true
    permalink            : /talks/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: scholar
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      hide_title: true
      body_class: "page page--publication"
  - scope:
      path: ""
      type: talks
    values:
      layout: talk-entry
      hide_title: true
      body_class: "page page--talk"

# -- Sass -----------------------------------------------------------------------------
sass:
  sass_dir               : _sass
  style                  : compressed

# -- Output -----------------------------------------------------------------------------
permalink                : /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
