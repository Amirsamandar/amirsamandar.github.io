# -- Homepage: four connected themes -------------------------------------------
themes_intro: >-
  Four areas, one question: how much can a single, noisy measurement really tell us?
themes:
  - numeral: "i"
    title: "Cosmology"
    text: "Could space be finite? I compute how its topology would imprint the CMB and build pipelines to search Planck data for it."
    link: "/research/#cmb-topology"
  - numeral: "ii"
    title: "Statistics and data analysis"
    text: "Detection probabilities, not just averages: likelihood-ratio tests calibrated for the search actually performed."
    link: "/research/#detectability"
  - numeral: "iii"
    title: "Probabilistic machine learning"
    text: "Neural emulators and amortized inference that make demanding analyses fast, checked against exact likelihoods (in development)."
    link: "/research/#sbi"
  - numeral: "iv"
    title: "LLMs and agentic AI"
    text: "Bayesian evaluation of language models, inference-time scaling, and AI agents in research, with checks on their reasoning and code."
    link: "/research/#llm-evaluation"

# -- /research/: projects (Problem / Contribution / Result / Status) -------------
projects:
  - id: detectability
    title: "Detectability and detection probability for model comparison"
    dates: "2025 – present"
    role: "First author, project lead"
    affiliation: "COMPACT Collaboration · CWRU"
    lead: "What an expected information gain does, and does not, say about detecting a model in the one data set we have."
    problem: >-
      The Kullback–Leibler (KL) divergence is widely used to forecast whether a model can be distinguished from a null hypothesis. For two specified models it gives the expected log-likelihood ratio when data are drawn from the model in its first argument; it does not, by itself, tell us how often a search will detect a signal or recover its parameters.
    contribution: >-
      Conceived the project and developed a forecasting pipeline connecting statistical distinguishability to detection probabilities and parameter recovery. For multivariate Gaussian data, derived the distribution of the log-likelihood ratio and its cumulants under both hypotheses, and examined its links to discovery potential and parameter-estimation accuracy when the null is a point and the alternative a continuous family. Calibrated parameter searches with simulations to quantify false-positive rates, detection probabilities, and the effect of the detection criterion on recovered parameters.
    result: >-
      Detectability depends not only on the KL divergence but on the size of the parameter space, the likelihood-ratio distributions, and the distance from parameter-space boundaries (the look-elsewhere effect). The KL–detectability relation therefore has to be calibrated for each model family and test statistic. Applications to a toy Gaussian model, the cubic three-torus, the tensor-to-scalar ratio from B-mode polarization, and dark energy from supernova distances show why a forecast needs to account for the behavior of the analysis that will actually be performed.
    status: "Preprint"
    status_kind: "done"
    papers:
      - label: "arXiv:2610.17186"
        url: "https://arxiv.org/abs/2610.17186"
    tags: ["Likelihood-ratio tests", "Information theory", "Look-elsewhere effect"]

  - id: cmb-topology
    title: "CMB statistics and covariance modeling for cosmic topology"
    dates: "2023 – present"
    role: "Project lead"
    affiliation: "COMPACT Collaboration · CWRU"
    lead: "If space is finite, the CMB is no longer described by a power spectrum alone. This project computes what replaces it."
    problem: >-
      Non-trivial spatial topology breaks statistical isotropy, so the CMB requires full non-diagonal covariance matrices over (ℓ, m, ℓ′, m′) instead of an angular power spectrum.
    contribution: >-
      Derived the spin-2 (tensor) eigenmodes and CMB covariance matrices for orientable compact Euclidean manifolds, the first such computation, and showed that topology alone can induce parity-odd TB/EB correlations. Made a lead contribution to the eigenmodes, covariances and detectability of the non-orientable manifolds. Developed CMBtopology, the GPU-parallelized package used across the collaboration for tensor-mode likelihood analysis. In development: an end-to-end pipeline to constrain topology with Planck PR4 data, and, as a LiteBIRD adjoint member, a forecasting pipeline that uses E-mode polarization alongside temperature.
    result: >-
      Two first-author JCAP papers (Parts IIIa and IIIb) and a lead contribution as second author to a third (Part IIb). Over the multipole range computed, topological information in tensor-induced anisotropies keeps growing with ℓ rather than saturating as quickly as in the scalar case. A fourth paper (Part IIIc, first author) is in preparation.
    status: "Ongoing"
    status_kind: "ongoing"
    papers:
      - label: "Part IIIa"
        url: "https://arxiv.org/abs/2407.09400"
      - label: "Part IIIb"
        url: "https://arxiv.org/abs/2503.08671"
      - label: "Part IIb"
        url: "https://arxiv.org/abs/2510.05030"
      - label: "CMBtopology"
        url: "https://github.com/CompactCollaboration/CMBtopology"
    tags: ["CMB polarization", "Eigenmode analysis", "GPU / HPC"]

  - id: sbi
    title: "Neural likelihood emulation and simulation-based inference"
    dates: "Current"
    dates_todo: "Start date conflict: the brief says 2025 – present; the CV says 2026 – present."
    role: "Project lead"
    affiliation: "COMPACT Collaboration · CWRU"
    lead: "Learned inference that is checked: where does an approximation succeed, and where does it alter the inference?"
    problem: >-
      Machine learning can make demanding analyses computationally feasible, but an accurate prediction of an observable does not by itself establish that the inferred constraints are reliable. A narrow posterior may reflect information in the data, restrictive simulation assumptions, or errors in a learned approximation. Bayesian parameter estimation for topology is also expensive, because searches must cover manifold size, orientation and observer position together.
    contribution: >-
      Leading work on neural likelihood emulators (variational autoencoders trained on simulated CMB data) and amortized inference, validated against conventional Bayesian methods. Because the likelihood can be evaluated directly in these problems, the comparison shows where learned approximations succeed and where they alter the inference; simulation-based calibration and coverage tests are part of the acceptance criterion. In a separate ongoing project with a student at the University of Toronto, investigating whether Koopman-operator methods can reduce the computational cost of diffusion-based posterior estimation without distorting the inferred distribution.
    result: >-
      No results yet. This work is in development.
    status: "In development"
    status_kind: "planned"
    tags: ["Simulation-based inference", "Neural emulators", "Calibration"]

  - id: learned-classification
    title: "Learned classification benchmarked against a known likelihood"
    dates: "Dec 2023 – Mar 2024"
    role: "Co-author"
    affiliation: "COMPACT Collaboration · CWRU / IFT Madrid"
    lead: "A machine-learning problem where the optimal answer is computable, so the network's shortfall can be measured."
    problem: >-
      Identifying the manifold behind a CMB map with the full likelihood is accurate but expensive.
    contribution: >-
      Contributed to benchmarking learned topology classification against a directly computable likelihood, and helped prepare and revise the manuscript.
    result: >-
      The paper shows that classifiers trained on simulated CMB maps approach likelihood-level discrimination at a fraction of the cost, and, because the likelihood is computable, measures the gap to the optimal decision rule.
    status: "Published"
    status_kind: "done"
    papers:
      - label: "JCAP 09 (2024) 057"
        url: "https://doi.org/10.1088/1475-7516/2024/09/057"
    tags: ["Machine learning", "Model comparison", "CMB"]

  - id: llm-evaluation
    title: "Calibrated evaluation and inference-time methods for language models"
    dates: "2025 – present"
    role: "Second author · co-author"
    affiliation: "Case Western Reserve University"
    lead: "The question behind the cosmology work, asked of a different system: how much evidence does one noisy measurement carry?"
    problem: >-
      LLM benchmarks usually report a score without uncertainty, so rankings can be unstable and the inference procedure behind a reported number is rarely stated.
    contribution: >-
      Co-developed a Bayesian evaluation framework that replaces Pass@k with Dirichlet-posterior estimates and credible intervals, accounting for variation across repeated responses and for the uncertainty from a finite number of trials. Contributed to the evaluation and uncertainty methods of a framework for test-time scaling, and to the new version of the open-source Scorio toolkit.
    result: >-
      Don't Pass@k appeared at ICLR 2026 (main conference); the test-time-scaling paper is accepted at TMLR. An extension to reinforcement learning, where calibrated evaluation shapes the training signal, is underway.
    status: "Published · accepted"
    status_kind: "done"
    papers:
      - label: "ICLR 2026"
        url: "https://arxiv.org/abs/2510.04265"
      - label: "TMLR (accepted)"
        url: "https://arxiv.org/abs/2608.04001"
      - label: "Scorio"
        url: "https://github.com/mohsenhariri/scorio"
    tags: ["Bayesian evaluation", "Test-time scaling", "LLMs"]

