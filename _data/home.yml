# Homepage copy. Keep the whole homepage under ~600 words (excluding paper cards).

headline: "Calibrated inference for the one universe we observe"
positioning: >-
  My research centers on how we extract physical information from cosmological data, determine what the data can distinguish, and make demanding analyses computationally feasible without compromising their statistical interpretation.

question_title: "One universe, one sky"
# One entry per paragraph.
question:
  - >-
    We observe exactly one universe. There is no second sky to check our answers against, so knowing what we can reliably learn from the one we have is central to cosmology. This question connects my work across cosmological data analysis, statistics, probabilistic machine learning, and AI. How do we extract information, quantify uncertainty, and know when to trust an answer?
  - >-
    In cosmology, I investigate whether non-trivial cosmic topology leaves detectable traces in the cosmic microwave background (CMB). In statistics, I study how often a search can recover a real signal and constrain its underlying parameters. Through probabilistic machine learning, I develop methods that learn from simulations to accelerate inference while testing the reliability of their uncertainties.
  - >-
    I also work on calibrated Bayesian evaluation of large language models and explore how AI agents can support scientific research. Across these directions, my aim is to make scientific conclusions and the tools behind them more trustworthy, with a clear account of what the evidence supports and what remains uncertain.

