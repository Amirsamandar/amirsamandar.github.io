# Homepage copy. Keep the whole homepage under ~600 words (excluding paper cards).

headline: "Calibrated inference for the one universe we observe"
positioning: >-
  My research centers on how we extract physical information from cosmological data, determine what the data can distinguish, and make demanding analyses computationally feasible without compromising their statistical interpretation.

question_title: "The question behind my work"
# 90–130 words.
question: >-
  Cosmology gives us one universe and one sky. Yet the statistics we use to decide whether a model is detectable are mostly averages over an ensemble of universes we will never observe. My research asks what those ensemble quantities tell us about the single measurement in hand, and how to answer that honestly: analytically where the distributions are tractable, and with learned inference, validated against those analytic cases, where they are not. The same question applies outside cosmology. A benchmark score for a language model is also one noisy draw from a distribution, usually reported as if it were a fixed number. In both settings the task is to state what the data support, with an uncertainty that can be checked.

