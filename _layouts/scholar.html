<!doctype html>
<html lang="en" class="no-js">
<head>
{% include scholar/head.html %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
{% include scholar/header.html %}
<main id="main" tabindex="-1">
{%- unless page.hide_title %}
  <header class="page-head wrap">
    {%- if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="page-head__title">{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
{%- endunless %}
{{ content }}
</main>
{% include scholar/footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
